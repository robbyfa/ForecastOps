groups:
  - name: forecastops
    rules:
      - alert: ForecastMonitoringStale
        expr: forecastops_monitoring_fresh == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Live monitoring is missing, expired, replayed, or has stale actuals
      - alert: ForecastBatchStale
        expr: forecastops_forecast_ready == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A fresh batch for the committed champion is unavailable
      - alert: ForecastApiUnavailable
        expr: up{job="forecastops"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Forecast API is unavailable
      - alert: ForecastRetrainingRequired
        expr: forecastops_retraining_required == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Observed demand performance crossed the retraining threshold
      - alert: ForecastFeatureDrift
        expr: forecastops_drift_psi > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Review a change in feature distribution
