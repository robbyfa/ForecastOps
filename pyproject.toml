[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forecastops"
version = "0.1.0"
description = "Reproducible retail demand forecasting and model operations"
requires-python = ">=3.12,<3.15"
dependencies = [
  # pandas 2.x timedelta operations warn with NumPy 2.4+; upgrade together.
  "pandas>=2.2,<3", "numpy>=1.26,<2.4", "scikit-learn>=1.6,<2",
  "xgboost>=3.0,<4", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  # MLflow's ORM uses noload, deprecated in SQLAlchemy 2.1.
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4",
  "prometheus-client>=0.21,<1", "joblib>=1.4,<2", "mlflow>=3.1,<4",
  "scipy>=1.13,<2", "filelock>=3.16,<4",
]

[project.scripts]
forecastops = "forecastops.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "httpx2>=2,<3", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["artifacts", "mlruns", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning", "error::FutureWarning"]
